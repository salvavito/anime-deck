<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anime Deck</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Anime Deck">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
/* Layout: Operate mode, iOS conventions. Header: segmented Discover / Favorites + two icon buttons.
   Discover: one card that flips. Front = discovery (poster, description, why you'd like it, taste-fit chart, Pass / Watchlist / Seen it).
   Back = feedback (rating slider Hated→Favorite, six aspect sliders, dropped switch, Save).
   Favorites: filter segment + dense rows that expand on tap.
   Color: neutrals + one tint (indigo). Each show's poster color is content, not UI. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:#e9e9ef; --fill2:#f5f5f8; --line:rgba(60,60,67,.14);
  --text:#1c1c1e; --mute:#6c6c72; --faint:#aeaeb4;
  --tint:#5856d6; --tintSoft:rgba(88,86,214,.12); --onTint:#ffffff;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mark:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 18px 40px -12px rgba(0,0,0,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#232325; --line:rgba(84,84,88,.55);
  --text:#f5f5f7; --mute:#98989f; --faint:#5a5a60;
  --tint:#7d7aff; --tintSoft:rgba(125,122,255,.18); --onTint:#ffffff;
  --shadow:0 18px 40px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#232325; --line:rgba(84,84,88,.55);
  --text:#f5f5f7; --mute:#98989f; --faint:#5a5a60;
  --tint:#7d7aff; --tintSoft:rgba(125,122,255,.18); --onTint:#ffffff;
  --shadow:0 18px 40px -12px rgba(0,0,0,.7); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;accent-color:var(--tint)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
::selection{background:var(--tintSoft)}
*{scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--tintSoft);outline-offset:2px}
button:disabled{cursor:default}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;gap:12px}

/* Header */
.hdr{display:flex;align-items:center;gap:8px}
.seg{flex:1;display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:9px;padding:2px;position:relative}
.seg button{position:relative;z-index:1;height:32px;font-size:13.5px;font-weight:600;border-radius:7px}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/2);background:var(--card);border-radius:7px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.seg.three{grid-template-columns:repeat(3,1fr)} .seg.three .th{width:calc((100% - 4px)/3)}
.seg.four{grid-template-columns:repeat(4,1fr);flex:none} .seg.four .th{width:calc((100% - 4px)/4)}
.lst .seg{flex:none}
.seg.four button{font-size:12.5px}
.ib{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--tint);flex:none}
.ib svg{width:18px;height:18px}
.ib:disabled{color:var(--faint)}

/* Flip card */
.stage{flex:1;min-height:0;position:relative;perspective:1800px}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .3s}
.flip.flipped{transform:rotateY(180deg)}
.flip.enter{opacity:0;transform:translateY(22px) scale(.97)}
.flip.leave-l{opacity:0;transform:translateX(-36px) rotate(-2.5deg)}
.flip.leave-r{opacity:0;transform:translateX(36px) rotate(2.5deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

/* Poster: the one bold element */
.poster{position:relative;height:clamp(180px,32vh,280px);background:var(--c2);overflow:hidden;isolation:isolate;flex:none}
.poster::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0) 55%),linear-gradient(to bottom,rgba(0,0,0,.28),rgba(0,0,0,0) 28%)}
.poster .bg{position:absolute;inset:-40px;z-index:-3;background-size:cover;background-position:center;filter:blur(30px) saturate(1.25) brightness(.85);transform:scale(1.15)}
.poster .pc{position:absolute;right:16px;bottom:16px;height:calc(100% - 62px);aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.45);opacity:0;transition:opacity .4s}
.poster.cover-in .pc{opacity:1}
.poster.has-cover .art,.poster.has-cover .kanji{display:none}
.poster.has-cover .pt{right:calc(30px + (100% - 62px)*.667)}
.sw{position:relative}.sw .swimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.kanji{position:absolute;right:3%;top:-6%;bottom:-6%;writing-mode:vertical-rl;font-family:var(--mark);font-weight:800;font-size:clamp(88px,26vw,132px);line-height:.9;color:#fff;opacity:.13;white-space:nowrap;pointer-events:none;letter-spacing:-.03em}
.pt{position:absolute;left:20px;right:20px;bottom:18px;color:#fff}
.pt .meta{font-size:13px;font-weight:500;color:rgba(255,255,255,.82)}
.pt h2{margin:4px 0 0;font-family:var(--disp);font-weight:700;font-size:clamp(26px,7.2vw,32px);line-height:1.04;letter-spacing:-.026em;text-wrap:balance}
.ptop{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.match{display:flex;align-items:baseline;gap:4px;color:#fff;background:rgba(0,0,0,.28);padding:5px 11px 6px;border-radius:999px}
.match b{font-family:var(--disp);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.match span{font-size:12px;font-weight:500;opacity:.85}
.cover{display:flex;align-items:center;gap:5px;color:#fff;background:rgba(0,0,0,.28);padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600}
.cover svg{width:13px;height:13px}

.fb{padding:16px 20px 18px;display:flex;flex-direction:column;gap:16px}
.desc{margin:0;font-size:15.5px;line-height:1.5;max-width:62ch}
.fit{display:flex;flex-direction:column;gap:12px;background:var(--fill2);border-radius:16px;padding:14px 14px 16px}
.fit h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.fit p{margin:0;font-size:14.5px;line-height:1.48;color:var(--text)}
.chart{display:grid;grid-template-columns:6.6em 1fr 2.4em;gap:9px 10px;align-items:center;font-size:12.5px}
.chart .n{color:var(--mute)}
.chart .v{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.track{position:relative;height:8px}
.track::before{content:"";position:absolute;left:33.3%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.track i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--tint)}
.track i.neg{background:var(--faint)}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);padding-left:calc(6.6em + 10px);padding-right:calc(2.4em + 10px)}
.tip{font-size:14px;line-height:1.45;color:var(--text);border-top:.5px solid var(--line);padding-top:12px}
.tip b{font-weight:600}

.actions{flex:none;display:grid;grid-template-columns:.95fr .8fr 1.25fr 1fr;gap:8px;padding:10px 12px 12px;border-top:.5px solid var(--line);background:var(--card)}
.actions.cal{grid-template-columns:1fr 2fr}
.btn{height:50px;border-radius:14px;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--fill);transition:transform .1s,opacity .2s}
.btn svg{width:17px;height:17px}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--tint);color:var(--onTint)}
.btn.quiet{color:var(--mute)}
.actions .btn{font-size:14.5px;gap:5px;padding:0 4px}
.actions .btn svg{width:15px;height:15px}
.btn.outline{color:var(--tint)}
.btn:disabled{opacity:.35}

/* Back face */
.bh{flex:none;display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:.5px solid var(--line)}
.bh .sw{width:36px;height:46px}
.bh .t{flex:1;min-width:0}
.bh .t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh .t span{font-size:12.5px;color:var(--mute)}
.link{color:var(--tint);font-size:16px;font-weight:500;padding:6px 2px}
.bb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:22px}
.qh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qh h3{margin:0;font-size:15px;font-weight:600}
.qh .hint{font-size:12.5px;color:var(--mute)}
.big{font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1;min-height:34px;transition:color .2s}
.big.unset{color:var(--faint)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;--p:50%;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--tint) 0 var(--p),var(--fill) var(--p) 100%)}
.rng::-moz-range-track{height:6px;border-radius:3px;background:var(--fill)}
.rng::-moz-range-progress{height:6px;border-radius:3px;background:var(--tint)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.08);transition:transform .15s}
.rng:active::-webkit-slider-thumb{transform:scale(1.1)}
.rng::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.rng.unset::-webkit-slider-runnable-track{background:var(--fill)}
.rng.unset::-webkit-slider-thumb{background:var(--card);box-shadow:0 0 0 2px var(--faint)}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:2px}
.scale button{padding:4px 0;flex:1;text-align:center;font-size:11.5px;color:var(--mute)}
.scale button:first-child{text-align:left}.scale button:last-child{text-align:right}
.scale button.on{color:var(--text);font-weight:600}
.aspects{display:flex;flex-direction:column;gap:2px;background:var(--fill2);border-radius:16px;padding:6px 14px}
.asp{display:grid;grid-template-columns:6.4em 1fr 4.6em;gap:12px;align-items:center;min-height:44px}
.asp label{font-size:14.5px}
.asp output{font-size:12.5px;color:var(--mute);text-align:right}
.asp .rng{height:30px}
.asp .rng::-webkit-slider-thumb{width:22px;height:22px;margin-top:-8px}
.asp .rng::-moz-range-thumb{width:22px;height:22px}
.asp .rng{--a:50%;--b:50%}
.asp .rng::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--fill) 0 var(--a),var(--tint) var(--a) var(--b),var(--fill) var(--b) 100%)}
.asp .rng.neg::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--fill) 0 var(--a),var(--faint) var(--a) var(--b),var(--fill) var(--b) 100%)}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);padding:0 4.6em 4px 7.2em}
.row2{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:15px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--fill);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.switch input:checked+span{background:var(--tint)}
.switch input:checked+span::after{transform:translateX(20px)}
.backact{flex:none;padding:10px 12px 12px;border-top:.5px solid var(--line)}
.backact .btn{width:100%}

.sw canvas{width:100%;height:100%;display:block}
.sw{flex:none;border-radius:8px;background:radial-gradient(90% 80% at 80% 15%,var(--c1),var(--c2));display:grid;place-items:center;color:rgba(255,255,255,.88);font-family:var(--mark);font-weight:800;font-size:15px;writing-mode:vertical-rl;overflow:hidden;line-height:1}

/* Favorites */
.lst{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.grp{background:var(--card);border-radius:14px;overflow:hidden}
.item+.item{border-top:.5px solid var(--line)}
.ir{width:100%;display:flex;align-items:center;gap:12px;padding:9px 14px;text-align:left;min-height:62px;box-sizing:border-box}
.ir .sw{width:34px;height:44px;font-size:13px}
.ir .t{flex:1;min-width:0}
.ir .t b{display:block;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir .t span{font-size:12.5px;color:var(--mute)}
.ir .r{font-size:13px;color:var(--mute);white-space:nowrap}
.ir .r.fav{color:var(--tint);font-weight:600}
.ir svg.chev{width:12px;height:12px;color:var(--faint);transition:transform .25s;flex:none}
.item.open svg.chev{transform:rotate(90deg)}
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.item.open .ex{grid-template-rows:1fr}
.ex>div{overflow:hidden}
.exin{padding:2px 14px 14px 60px;display:flex;flex-direction:column;gap:12px}
.exin p{margin:0;font-size:14px;line-height:1.48;color:var(--text)}
.exin .soft{color:var(--mute)}
.exact{display:flex;gap:16px}
.exact button{color:var(--tint);font-size:14px;font-weight:500;padding:4px 0}
.exact button.del{color:var(--mute)}
.empty{display:grid;place-items:center;text-align:center;padding:40px 24px;color:var(--mute);line-height:1.5}
.empty b{display:block;font-family:var(--disp);font-size:20px;color:var(--text);margin-bottom:6px;letter-spacing:-.015em}
.done{position:absolute;inset:0;background:var(--card);border-radius:28px;box-shadow:var(--shadow);display:grid;place-items:center}

/* Engine sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
.sheet[hidden]{display:none!important}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheetin{width:100%;max-width:480px;max-height:90%;background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheethead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheethead h3{margin:0;font-size:17px;font-weight:600}
.sheethead button{justify-self:end;color:var(--tint);font-weight:600;font-size:17px}
.sheetbody{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.cap{font-size:13px;color:var(--mute);padding:16px 16px 4px}
.foot{font-size:12.5px;color:var(--mute);padding:4px 16px 8px;line-height:1.45}
.cell{padding:11px 16px;display:flex;align-items:center;gap:12px}
.cell+.cell{border-top:.5px solid var(--line)}
.wcell{display:grid;grid-template-columns:1fr 3em;gap:2px 10px;align-items:center}
.wcell .rng{grid-column:1/-1;height:28px}
.wcell output{text-align:right;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.wcell .sub{font-size:12px;color:var(--mute)}
.linkbtn{color:var(--tint);font-size:15px;padding:12px 16px;text-align:left;width:100%}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .22s,transform .22s;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.flip{transition:opacity .2s}.flip.flipped{transform:none}.flip.flipped .front{opacity:0;pointer-events:none}.face.back{transform:none;opacity:0;pointer-events:none}.flip.flipped .face.back{opacity:1;pointer-events:auto}*{animation:none!important}}
@media (max-height:700px){.poster{height:160px}.fb{gap:14px}}
@media (min-width:700px){.app{max-width:640px;padding-block:18px 20px}.poster{height:clamp(260px,34vh,400px)}.desc{font-size:17px}.fit p{font-size:15.5px}}
</style>
</head><body>


<div class="app">
  <div class="hdr">
    <div class="seg three" id="tabs" role="tablist" aria-label="Section">
      <div class="th"></div>
      <button role="tab" data-t="discover" aria-selected="true">Discover</button>
      <button role="tab" data-t="watch" aria-selected="false">Watchlist</button>
      <button role="tab" data-t="favs" aria-selected="false">Favorites</button>
    </div>
    <button class="ib" id="bUndo" aria-label="Undo last answer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button class="ib" id="bEngine" aria-label="Taste engine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </div>
  <section class="stage" id="stage" aria-live="polite"></section>
  <section class="lst" id="favs" hidden></section>
</div>

<div class="sheet" id="engSheet" hidden><div class="sheetin" role="dialog" aria-labelledby="et">
  <div class="sheethead"><span></span><h3 id="et">Taste Engine</h3><button data-close>Done</button></div>
  <div class="sheetbody" id="engBody"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const AXES=[
 {k:"w",n:"Writing",d:"Story depth, characters, payoff",ph:"great writing"},
 {k:"a",n:"Animation",d:"Craft and fight choreography",ph:"top-level animation"},
 {k:"m",n:"Mature tone",d:"Seinen themes, moral grey",ph:"a mature, adult tone"},
 {k:"o",n:"Originality",d:"Quirky, unlike anything else",ph:"a very original idea"},
 {k:"x",n:"Action",d:"Fights and adrenaline",ph:"great fights"},
 {k:"h",n:"Humor",d:"Smart comedy",ph:"smart humor"},
 {k:"d",n:"Auteur style",d:"A director's signature look",ph:"a strong director's style"},
 {k:"sp",n:"Sports",d:"Sports drama done well",ph:"sports drama done right"},
 {k:"f",n:"Fan service",d:"Penalty"},
 {k:"s",n:"Slow start",d:"Penalty"},
 {k:"g",n:"Generic hype",d:"Penalty: basic story, shallow power trip"}

 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>'};
const stage=$("stage");let cur=null,F=null;

function setTabs(){const t=$("tabs");t.querySelector(".th").style.transform=`translateX(${["discover","watch","favs"].indexOf(S.tab)*100}%)`;
 t.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===S.tab));
 $("stage").hidden=S.tab!=="discover";$("favs").hidden=S.tab==="discover";$("bUndo").disabled=!S.hist.length;}
function render(anim){setTabs();if(S.tab!=="discover"){renderFavs();return;}
 const q=queue();if(!q.length){stage.innerHTML=`<div class="done"><div class="empty"><b>You rated the whole deck</b>Open the taste engine and tap Ask Claude for new picks, or load more shows from AniList.</div></div>`;return;}
 const c=cur=q[0];const m=scores()[c.id];
 F={rating:null,aspects:{},dropped:false};
 const meta=`${c.auto?"AniList pick. ":c.cal?"":"Claude's pick. "}${c.second?"Second chance. ":""}${c.year} ${c.kind.toLowerCase()}, ${c.eps}, ${c.studio}`;
 stage.innerHTML=`<div class="flip${anim?" enter":""}" id="flip">
 <article class="face front" style="--c1:${c.c1};--c2:${c.c2}">
  <div class="scroll">
   <div class="poster" data-cover="${c.id}"><canvas class="art" data-paint="${c.id}" aria-hidden="true"></canvas><div class="kanji" aria-hidden="true">${esc(c.jp)}</div>
    <div class="ptop"><span class="match"><b>${m}%</b><span>${c.cal?"predicted":"match"}</span></span>
     <a class="cover" data-anilist="${c.id}" href="${coverURL(c)}" target="_blank" rel="noopener">${I.img}Cover</a></div>
    <div class="pt"><div class="meta">${esc(meta)}</div><h2>${esc(c.title)}</h2></div></div>
   <div class="fb">
    ${c.cal?`<p class="desc">You told me about this one. Rating it teaches the engine what you value, and makes every other match more accurate.</p>`:`<p class="desc">${esc(c.desc)}</p>`}
    <div class="fit"><h3>${c.cal?"What the engine expects":c.auto?"Why it might fit":"Why you'd like it"}</h3>
     <p>${esc(whyText(c))}</p>
     <div class="chart" role="img" aria-label="How each part of the show adds to or takes away from your match">${chartRows(c)}</div>
     <div class="legend"><span>Hurts</span><span>Helps your match</span></div>
     ${c.tip?`<div class="tip"><b>How to watch it.</b> ${esc(c.tip)}</div>`:""}${c.auto?`<div class="tip">Scored automatically from AniList (${c.score}/100). Add it to your watchlist and Claude can take a closer look.</div>`:""}
    </div>
   </div></div>
  <div class="actions${c.cal?" cal":""}">
   ${c.cal?`<button class="btn quiet" id="bSkip">Skip</button><button class="btn primary" id="bSeen">${I.eye}Rate it</button>`:
   `<button class="btn quiet" id="bSkip">Not sure</button><button class="btn quiet" id="bPass">${I.x}Pass</button><button class="btn primary" id="bWatch">${I.plus}Watchlist</button><button class="btn outline" id="bSeen">${I.eye}Seen it</button>`}
  </div>
 </article>
 <article class="face back" style="--c1:${c.c1};--c2:${c.c2}" aria-hidden="true">
  <div class="bh"><div class="sw" data-cover="${c.id}"><canvas data-paint="${c.id}"></canvas></div><div class="t"><b>${esc(c.title)}</b><span>Tell me what you thought</span></div><button class="link" id="bCancel">Cancel</button></div>
  <div class="scroll"><div class="bb">
   <div><div class="qh"><h3>How was it?</h3><span class="hint">Drag or tap a word</span></div>
    <div class="big unset" id="rLabel">Not rated yet</div>
    <input class="rng unset" type="range" id="rRange" min="0" max="5" step="1" value="3" aria-label="Your rating, from hated it to all-time favorite">
    <div class="scale" id="rScale">${SHORT.map((s,i)=>`<button data-i="${i}">${s}</button>`).join("")}</div></div>
   <div><div class="qh" style="margin-bottom:8px"><h3>What stood out?</h3><span class="hint">Optional</span></div>
    <div class="aspects">${ASPECTS.map(a=>`<div class="asp"><label for="a-${a.k}">${a.n}</label><input class="rng" type="range" id="a-${a.k}" data-k="${a.k}" min="-2" max="2" step="1" value="0"><output id="o-${a.k}">No opinion</output></div>`).join("")}</div></div>
   <label class="row2" for="dropped">I stopped before the end<span class="switch"><input type="checkbox" id="dropped"><span></span></span></label>
  </div></div>
  <div class="backact"><button class="btn primary" id="bSave" disabled>Save rating</button></div>
 </article></div>`;
 paintAll(stage);applyCovers(stage);wantCovers(q.slice(0,8).map(x=>x.id));
 const flip=$("flip");if(anim)requestAnimationFrame(()=>requestAnimationFrame(()=>flip.classList.remove("enter")));
 const front=flip.querySelector(".front"),back=flip.querySelector(".back");
 const flipTo=b=>{flip.classList.toggle("flipped",b);front.setAttribute("aria-hidden",b);back.setAttribute("aria-hidden",!b);front.inert=b;back.inert=!b;};
 back.inert=true;
 $("bSeen").onclick=()=>flipTo(true);$("bCancel").onclick=()=>flipTo(false);
 if($("bPass"))$("bPass").onclick=()=>commit("pass");
 if($("bWatch"))$("bWatch").onclick=()=>commit("watch");
 if($("bSkip"))$("bSkip").onclick=()=>{S.skipped=[...new Set([...(S.skipped||[]).filter(x=>x!==c.id),c.id])];saveLocal();toast("Saved for later. It comes back at the end.");leave("l");};
 const rr=$("rRange"),rl=$("rLabel");
 const paintR=()=>{const i=+rr.value;F.rating=i;rr.classList.remove("unset");rr.style.setProperty("--p",(i/5*100)+"%");
  rl.textContent=RATING[i].n;rl.classList.remove("unset");$("rScale").querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
  $("bSave").disabled=false;$("bSave").textContent=`Save: ${RATING[i].n.toLowerCase()}`;};
 rr.addEventListener("input",paintR);rr.addEventListener("change",paintR);
 rr.addEventListener("pointerdown",()=>{if(F.rating===null)setTimeout(paintR,0);});
 $("rScale").querySelectorAll("button").forEach(b=>b.onclick=()=>{rr.value=b.dataset.i;paintR();});
 back.querySelectorAll(".asp .rng").forEach(r=>{const paint=()=>{const v=+r.value,k=r.dataset.k;
   const a=v<0?50+v*25:50,b=v>0?50+v*25:50;r.style.setProperty("--a",a+"%");r.style.setProperty("--b",b+"%");r.classList.toggle("neg",v<0);
   $("o-"+k).textContent=(k==="s"?PACEWORD:ASPWORD)[v];if(v)F.aspects[k]=v;else delete F.aspects[k];};r.oninput=paint;paint();});
 $("dropped").onchange=e=>F.dropped=e.target.checked;
 $("bSave").onclick=()=>{if(F.rating===null)return;commit(RATING[F.rating].id,F.aspects,F.dropped);};}
function leave(dir){const f=$("flip");if(f){f.classList.remove("flipped");f.classList.add(dir==="l"?"leave-l":"leave-r");}setTimeout(()=>render(true),260);}
function commit(verdict,aspects={},dropped=false){const c=cur;const p={verdict,aspects:{...aspects},dropped:!!dropped};
 S.hist.push({id:c.id,w:{...S.w},prev:S.picks[c.id]||null});if(S.hist.length>60)S.hist.shift();
 S.picks[c.id]=p;rebuild();saveLocal();pushPick(c.id);pushW();
 toast(verdict==="watch"?"Added to watchlist":verdict==="pass"?"Passed":verdict==="fav"?"Added to favorites":`Saved: ${VERD[verdict].n.toLowerCase()}`);
 leave(["pass","hate","dis"].includes(verdict)?"l":"r");}
function undo(){const h=S.hist.pop();if(!h)return;if(h.prev)S.picks[h.id]=h.prev;else delete S.picks[h.id];rebuild();saveLocal();pushPick(h.id);pushW();
 front=h.id;S.tab="discover";toast("Undone");render(true);}

// ---------- Favorites tab ----------
const FILTERS=[{id:"fav",n:"Favorites"},{id:"love",n:"Loved"},{id:"all",n:"All rated"}];
function inFilter(p,f){if(f==="all")return VERD[p.verdict].seen;return p.verdict===f;}
function renderFavs(){const el=$("favs");const m=scores();const W=S.tab==="watch";if(!W&&S.filter==="watch")S.filter="fav";const F0=W?"watch":S.filter;
 const counts=Object.fromEntries(FILTERS.map(f=>[f.id,Object.values(S.picks).filter(p=>inFilter(p,f.id)).length]));
 const fi=FILTERS.findIndex(f=>f.id===S.filter);
 let items=Object.entries(S.picks).filter(([id,p])=>byId[id]&&inFilter(p,F0)).map(([id,p])=>({c:byId[id],p}));
 items.sort((a,b)=>F0==="watch"?m[b.c.id]-m[a.c.id]:(VERD[b.p.verdict].i??0)-(VERD[a.p.verdict].i??0)||a.c.title.localeCompare(b.c.title));
 const empty={fav:["No favorites yet","Rate a show you've seen as an all-time favorite and it appears here."],love:["Nothing loved yet","Shows you rate Loved it appear here."],watch:["Your watchlist is empty","Tap Watchlist on any card in Discover."],all:["Nothing rated yet","Tap Seen it on a card to rate a show."]}[F0];
 el.innerHTML=(W?`<div class="foot" style="padding:2px 4px 0">${items.length} to watch, best match first.</div>`:`<div class="seg three" id="filt" role="tablist" aria-label="Filter"><div class="th" style="transform:translateX(${fi*100}%)"></div>${FILTERS.map(f=>`<button role="tab" aria-selected="${f.id===S.filter}" data-f="${f.id}">${f.n}${counts[f.id]?` ${counts[f.id]}`:""}</button>`).join("")}</div>`)+
 (items.length?`<div class="grp">${items.map(({c,p})=>itemHTML(c,p,m[c.id])).join("")}</div>${W?`<div class="grp"><button class="linkbtn" id="copyW">Copy watchlist</button></div>`:""}`
  :`<div class="grp"><div class="empty"><b>${empty[0]}</b>${empty[1]}</div></div>`);
 paintAll(el);applyCovers(el);wantCovers(items.map(x=>x.c.id));
 el.querySelectorAll("#filt button").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;saveLocal();renderFavs();});
 el.querySelectorAll(".ir").forEach(b=>b.onclick=()=>{const it=b.closest(".item");const open=!it.classList.contains("open");it.classList.toggle("open",open);b.setAttribute("aria-expanded",open);});
 el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const id=b.dataset.rm;S.hist.push({id,w:{...S.w},prev:S.picks[id]});delete S.picks[id];rebuild();saveLocal();pushPick(id);pushW();toast("Moved back to Discover");renderFavs();});
 const cw=$("copyW");if(cw)cw.onclick=async()=>{const t=items.map(({c})=>`${c.title} (${c.year})`).join("\n");try{await navigator.clipboard.writeText(t);toast("Watchlist copied");}catch(e){toast("Copy is blocked here");}};
 setTabs();}
function itemHTML(c,p,m){const v=VERD[p.verdict];
 const asp=ASPECTS.filter(a=>(p.aspects||{})[a.k]).map(a=>{const x=p.aspects[a.k];return `${a.n.toLowerCase()} ${(a.k==="s"?PACEWORD:ASPWORD)[x].toLowerCase()}`;});
 let mine;
 if(v.seen){mine=asp.length?`You said: ${asp.join(", ")}${p.dropped?", and you stopped before the end":""}.`:`${{hate:"You hated it",dis:"You didn't like it",ok:"You thought it was okay",like:"You liked it",love:"You loved it",fav:"One of your all-time favorites"}[p.verdict]}${p.dropped?", and you stopped before the end":""}. Rate the details next time with the sliders on the back of the card.`;}
 else mine=whyText(c);
 return `<div class="item"><button class="ir" aria-expanded="false" style="--c1:${c.c1};--c2:${c.c2}"><span class="sw" data-cover="${c.id}"><canvas data-paint="${c.id}"></canvas></span><span class="t"><b>${esc(c.title)}</b><span>${c.year} ${esc(c.kind.toLowerCase())}${v.seen?"":`, ${m}% match`}</span></span>${p.verdict==="watch"?"":`<span class="r${p.verdict==="fav"?" fav":""}">${v.short}</span>`}${I.chev}</button>
 <div class="ex"><div><div class="exin"><p>${esc(mine)}</p>${c.desc?`<p class="soft">${esc(c.desc)}</p>`:""}
 <div class="exact"><a class="exact-l" href="${coverURL(c)}" target="_blank" rel="noopener" style="color:var(--tint);font-size:14px;font-weight:500">See cover</a><button class="del" data-rm="${c.id}">Remove</button></div></div></div></div></div>`;}

// ---------- Engine sheet ----------
document.querySelectorAll(".sheet").forEach(s=>s.addEventListener("click",e=>{if(e.target===s||e.target.closest("[data-close]")){s.hidden=true;render(false);}}));
$("bEngine").onclick=()=>{buildEngine();$("engSheet").hidden=false;};
function pct(v,lo,hi){return ((v-lo)/(hi-lo)*100)+"%";}
function buildEngine(){const el=$("engBody");
 const wc=a=>`<div class="cell wcell"><label for="w-${a.k}">${a.n}<div class="sub">${a.d}</div></label><output id="wo-${a.k}">${(+S.w[a.k]).toFixed(1)}</output><input class="rng" type="range" id="w-${a.k}" min="-4" max="4" step="0.1" value="${S.w[a.k]}" style="--p:${pct(S.w[a.k],-4,4)}"></div>`;
 const tg=(id,n,k)=>`<label class="cell" for="${id}" style="justify-content:space-between"><span>${n}</span><span class="switch"><input type="checkbox" id="${id}" ${S[k]?"checked":""}><span></span></span></label>`;
 el.innerHTML=`<div class="foot" style="padding-top:2px">Every show is scored 0 to 10 on these axes. Your weights decide the match. Each answer moves them: a favorite moves them most, "okay" barely at all, and each aspect slider pushes its own axis.</div>
 <div class="cap">What you value</div><div class="grp">${AXES.filter(a=>BASE[a.k]>0).map(wc).join("")}</div>
 <div class="cap">What you avoid</div><div class="grp">${AXES.filter(a=>BASE[a.k]<0).map(wc).join("")}</div>
 <div class="cap">Filters</div><div class="grp">
  <div class="cell wcell"><label for="fsMax">Highest fan service allowed</label><output id="fsOut">${S.fsMax}</output><input class="rng" type="range" id="fsMax" min="0" max="10" step="1" value="${S.fsMax}" style="--p:${pct(S.fsMax,0,10)}"></div>
  ${tg("tFilms","Include movies","films")}${tg("tSecond","Second-chance cards","second")}${tg("tLearn","Learn from my answers","learn")}</div>
 <div class="grp" style="margin-top:12px"><button class="linkbtn" id="resetW">Clear my manual changes</button></div>
 <div class="cap">More shows</div><div class="grp"><button class="linkbtn" id="moreAL">Find more shows on AniList</button><button class="linkbtn" id="askC">Ask Claude for new picks</button></div>
 <div class="foot">"Ask Claude" copies your ratings as a message. Paste it into your Anime chat with Claude, and new Claude picks appear here the next time you open the app.</div>
 <div class="foot">Your answers are saved on this iPad. Shows marked AniList are scored automatically from AniList tags, studios and directors. Claude's picks are written and scored by Claude.</div>`;
 $("moreAL").onclick=async()=>{toast("Loading from AniList…");const n=await loadExplore(true);rebuild();toast(n?`${n} new shows added`:"No new shows found");};
 $("askC").onclick=async()=>{const t=claudeBrief();try{await navigator.clipboard.writeText(t);toast("Copied. Paste it to Claude.");}catch(e){prompt("Copy this and send it to Claude",t);}};
 AXES.forEach(a=>{const i=$("w-"+a.k);i.oninput=()=>{S.adj[a.k]=+(+i.value-DER[a.k]).toFixed(3);S.w[a.k]=+i.value;i.style.setProperty("--p",pct(+i.value,-4,4));$("wo-"+a.k).textContent=(+i.value).toFixed(1);saveLocal();pushW();};});
 const fs=$("fsMax");fs.oninput=()=>{S.fsMax=+fs.value;fs.style.setProperty("--p",pct(+fs.value,0,10));$("fsOut").textContent=fs.value;saveLocal();};
 [["tFilms","films"],["tSecond","second"],["tLearn","learn"]].forEach(([id,k])=>{$(id).onchange=e=>{S[k]=e.target.checked;if(k==="learn")rebuild();saveLocal();};});
 $("resetW").onclick=()=>{S.adj={};rebuild();saveLocal();buildEngine();toast("Manual changes cleared");};}

$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(S.tab===b.dataset.t)return;S.tab=b.dataset.t;saveLocal();render(true);});
$("bUndo").onclick=undo;
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1500);}
render(false);
(async()=>{try{const r=await fetch("curated.json",{cache:"no-store"});if(r.ok){const j=await r.json();let n=0;(j.shows||[]).forEach(row=>{if(byId[row[0]])return;const c=toCard(row,false);CAT.push(c);ALL.push(c);byId[c.id]=c;if(row[13])MOTIF[c.id]=row[13];n++;});if(j.overrides)Object.assign(Q_OVERRIDE,j.overrides);if(n){rebuild();if(S.tab==="discover")render(false);}}}catch(e){}
 try{const n=await loadExplore(false);if(n){rebuild();if(S.tab==="discover"&&!$("flip")?.classList.contains("flipped"))render(false);}}catch(e){}})();
rebuild();
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>paintAll(),150);});
})();
</script>

</body></html>
